name: kabadiwala_connect
description: "Kabadiwala Connect — scrap collector tool."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  image_picker: ^1.2.3
  flutter_litert: ^3.8.0
  http: ^1.6.0
  http_parser: ^4.1.2
  geolocator: ^13.0.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/ml/labels.txt
    # Drop scrap_classifier.tflite in assets/ml/ and uncomment the line below:
    # - assets/ml/scrap_classifier.tflite
